# Relayweft in Forgejo or Gitea Actions: copy this file to
# .forgejo/workflows/relayweft.yml (Gitea: .gitea/workflows/relayweft.yml)
# in your repository. Setup, runner labels and the security model:
# docs/ci.md.
#
#   - Label an issue "rw": a job runs it and opens a pull request ("Closes #N").
#   - Every night at 02:30 UTC: the open issues labelled "rw" that no open
#     pull request closes yet, at most 5.
#   - Actions > relayweft > Run workflow: one issue by number, or the batch.
#
# Secrets (Settings > Actions > Secrets):
#   CLAUDE_CODE_OAUTH_TOKEN  and/or ANTHROPIC_API_KEY: Claude Code
#   OPENAI_API_KEY           and/or CODEX_AUTH_JSON: Codex
#   RELAYWEFT_TOKEN         optional: an access token used instead of the
#                            job's own, so the pull requests start your CI
#
# Every value reaches the shell through env, never through an expression
# inside a script.
name: relayweft

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty runs every open issue labelled rw)
        required: false

# The job pushes a branch, opens a pull request and comments on the issue;
# nothing else.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  relayweft:
    # Only the "rw" label starts a run. Adding a label needs write access to
    # the issues, so someone you trust decides which issue the agents read.
    if: github.event_name != 'issues' || github.event.label.name == 'rw'
    # A label of your runner (forgejo-runner register --labels ...) that runs
    # jobs in Docker: the job brings its own image. On Gitea's act_runner the
    # default labels are ubuntu-latest and the like.
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 120
    # One run per issue at a time; the nightly batch waits for the others.
    concurrency:
      group: relayweft-${{ github.event.issue.number || github.event.inputs.issue || 'batch' }}
      cancel-in-progress: false
    env:
      RW_VERSION: latest          # vX.Y.Z or latest
      # Where rw's release binaries and checksums.txt are: GitHub, or a
      # mirror with the same layout (<base>/download/<version>/<file>).
      RW_RELEASES: https://github.com/Sparkz400/relayweft/releases
      RW_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
      RW_ISSUES_LABEL: rw
      RW_LIMIT: "5"
      RW_PROVIDER: ""             # codex or claude; default: the one with credentials
      RW_BUDGET_TASK_USD: "10"    # stop a task at this API-equivalent $ (0 = no limit)
      RW_DRAFT: "false"
      RW_BASE: ""                 # default: the repository's default branch
      RW_ARGS: ""                 # more rw run flags
      RW_TRUST_REPO_CONFIG: "true"
      # npm package specs of the agent CLIs (a version, or a tarball URL).
      CLAUDE_CODE_PACKAGE: "@anthropic-ai/claude-code@latest"
      CODEX_PACKAGE: "@openai/codex@latest"
    steps:
      - name: install rw
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;;
            *) echo "no rw build for $(uname -m)"; exit 1 ;;
          esac
          asset="rw-linux-$arch"
          if [ "$RW_VERSION" = latest ]; then
            base="$RW_RELEASES/latest/download"
          else
            base="$RW_RELEASES/download/$RW_VERSION"
          fi
          bin="$RUNNER_TEMP/relayweft-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$bin/checksums.txt" "$base/checksums.txt"
          (cd "$bin" && grep " \*\?$asset\$" checksums.txt | sha256sum -c -)
          mv "$bin/$asset" "$bin/rw" && chmod +x "$bin/rw"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/rw" version

      - name: install agent CLIs
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          # The runner puts the job token in every step; npm's install
          # scripts don't need it.
          unset GITHUB_TOKEN FORGEJO_TOKEN GITEA_TOKEN
          claude=false; codex=false
          if [ "$HAS_CLAUDE" = true ]; then claude=true; fi
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$CODEX_AUTH_JSON" ]; then codex=true; fi
          if [ "$claude" = false ] && [ "$codex" = false ]; then
            echo "no agent credentials: set the secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (Claude Code), and/or OPENAI_API_KEY or CODEX_AUTH_JSON (Codex)"
            exit 1
          fi
          provider="$RW_PROVIDER"
          if [ -z "$provider" ] && [ "$claude" != "$codex" ]; then
            if [ "$claude" = true ]; then provider=claude; else provider=codex; fi
          fi
          echo "RW_PROVIDER=$provider" >> "$GITHUB_ENV"
          pkgs=()
          if [ "$claude" = true ]; then pkgs+=("$CLAUDE_CODE_PACKAGE"); fi
          if [ "$codex" = true ]; then pkgs+=("$CODEX_PACKAGE"); fi
          npm install -g --no-fund --no-audit "${pkgs[@]}"
          if [ "$claude" = true ]; then claude --version; fi
          if [ "$codex" = true ]; then
            codex --version
            home="$RUNNER_TEMP/relayweft-codex-home"
            mkdir -p "$home" && chmod 700 "$home"
            echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
            export CODEX_HOME="$home"
            if [ -n "$CODEX_AUTH_JSON" ]; then
              (umask 077; printf '%s' "$CODEX_AUTH_JSON" > "$home/auth.json")
            else
              printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
            fi
          fi

      - name: check out
        env:
          FORGEJO_TOKEN: ${{ secrets.RELAYWEFT_TOKEN || secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "$SERVER/$REPO.git"
          # git fetches and rw pushes with a credential helper that reads
          # the token from the environment, so it is not in .git/config.
          # Agents and the commands rw runs for them get an environment
          # without it, so a push of theirs finds no credentials.
          git config --local "credential.$SERVER.helper" ""
          git config --local --add "credential.$SERVER.helper" '!f() { test "$1" = get && test -n "$FORGEJO_TOKEN" || exit 0; echo username=x-access-token; echo "password=$FORGEJO_TOKEN"; }; f'
          base="$RW_BASE"
          if [ -z "$base" ]; then
            base=$(git ls-remote --symref origin HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')
          fi
          git fetch -q --depth=50 origin "+refs/heads/$base:refs/remotes/origin/$base"
          git checkout -q -B "$base" "refs/remotes/origin/$base"
          git config user.name "Relayweft"
          git config user.email "relayweft@noreply.${SERVER#*://}"
          if [ "$RW_TRUST_REPO_CONFIG" = true ] && [ -f .relayweft.yaml ]; then rw trust --yes; fi
          git log --oneline -1

      - name: rw run
        env:
          # rw reads issues, pushes and opens pull requests with this token,
          # and sends it only to this server. (rw after v0.2.0 also finds
          # the server without GITEA_HOST.)
          GITEA_HOST: ${{ github.server_url }}
          FORGEJO_TOKEN: ${{ secrets.RELAYWEFT_TOKEN || secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.RELAYWEFT_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/relayweft-report"
          mkdir -p "$out"
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          rw history --json -n 1000 > "$out/.before.json" 2>/dev/null || echo '[]' > "$out/.before.json"
          args=(run)
          if [ -n "$RW_ISSUE" ]; then
            args+=(--issue "$RW_ISSUE" --pr)
          else
            args+=(--issues "label:$RW_ISSUES_LABEL" --limit "$RW_LIMIT" --pr)
          fi
          if [ "$RW_DRAFT" = true ]; then args+=(--draft); fi
          if [ -n "$RW_BASE" ]; then args+=(--base "$RW_BASE"); fi
          if [ -n "$RW_PROVIDER" ]; then args+=(--provider "$RW_PROVIDER"); fi
          if [ -n "$RW_BUDGET_TASK_USD" ]; then args+=(--budget-task-usd "$RW_BUDGET_TASK_USD"); fi
          if [ -n "$RW_ARGS" ]; then read -r -a extra <<< "$RW_ARGS"; args+=("${extra[@]}"); fi
          echo "rw ${args[*]}"
          rw "${args[@]}" 2>&1 | tee "$out/rw-run.log"
          rc=${PIPESTATUS[0]}

          echo "--- reports"
          rw history --json -n 1000 > "$out/.after.json" 2>/dev/null || echo '[]' > "$out/.after.json"
          ids=$(node -e '
            const fs = require("fs");
            const old = new Set(JSON.parse(fs.readFileSync(process.argv[1])).map(t => t.id));
            for (const t of JSON.parse(fs.readFileSync(process.argv[2])).reverse()) if (!old.has(t.id)) console.log(t.id);
          ' "$out/.before.json" "$out/.after.json" || true)
          for id in $ids; do
            rw report "$id" --out "$out/$id.html" >/dev/null || true
            if rw report "$id" --md --out "$out/$id.md" >/dev/null; then cat "$out/$id.md"; fi
          done
          rm -f "$out/.before.json" "$out/.after.json"
          grep -E '^opened (pull|merge) request [#!][0-9]+: ' "$out/rw-run.log" || true
          exit "$rc"

      # The reports (HTML and Markdown) and the run log are in
      # $RUNNER_TEMP/relayweft-report. To keep them, upload them; on a
      # public repository anyone can download them:
      # - uses: actions/upload-artifact@v3
      #   if: always()
      #   with:
      #     name: relayweft-report
      #     path: ${{ runner.temp }}/relayweft-report

      - name: clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/relayweft-codex-home"
