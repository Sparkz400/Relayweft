# Copy to bitbucket-pipelines.yml and copy ci/forge-job.sh to .relayweft-ci/forge-job.sh.
# Secured repository variables: BITBUCKET_TOKEN and ANTHROPIC_API_KEY.
# BITBUCKET_TOKEN is email:API-token for issues. See docs/ci-azure-bitbucket.md.
image: node:22-bookworm
clone:
  depth: 50
pipelines:
  custom:
    relayweft:
      - variables:
          - name: RW_ISSUE
            default: ''
      - step:
          name: Relayweft issues
          max-time: 90
          script:
            - export RW_FORGE=bitbucket RW_PROVIDER=claude RW_BUDGET_TASK_USD=5 RW_LIMIT=1 RW_DRAFT=true
            - bash .relayweft-ci/forge-job.sh
          artifacts:
            - relayweft-report/**
