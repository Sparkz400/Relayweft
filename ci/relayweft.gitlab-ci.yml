# Relayweft in GitLab CI: runs issues as Relayweft tasks and opens a merge
# request for each ("Closes #N"). Setup and the security model: docs/ci.md.
#
# In your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/Sparkz400/relayweft/main/ci/relayweft.gitlab-ci.yml
#
# then add a pipeline schedule (Build > Pipeline schedules) on the default
# branch with the variable RELAYWEFT=1. Every run takes the open issues
# labelled "rw" that no open merge request closes yet. For one issue, run a
# pipeline (Build > Pipelines > Run pipeline, or the trigger API) with
# RELAYWEFT=1 and RW_ISSUE=<number>.
#
# CI/CD variables (Settings > CI/CD > Variables, masked and protected):
#   GITLAB_TOKEN             project access token, role Developer, scopes api
#                            and write_repository (reads the issue, pushes the
#                            branch, opens the merge request, comments)
#   CLAUDE_CODE_OAUTH_TOKEN  and/or ANTHROPIC_API_KEY: Claude Code
#   OPENAI_API_KEY           and/or CODEX_AUTH_JSON (a File variable): Codex

relayweft:
  image: node:22-bookworm
  rules:
    - if: '$RELAYWEFT == "1" && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/'
  # One run at a time per project.
  resource_group: relayweft
  timeout: 2h
  variables:
    RW_VERSION: latest          # vX.Y.Z or latest
    RW_ISSUE: ""                # one issue (number or URL) instead of the label batch
    RW_ISSUES_LABEL: rw
    RW_LIMIT: "5"
    RW_PROVIDER: ""             # codex or claude; default: the one with credentials
    RW_BUDGET_TASK_USD: "10"    # stop a task at this API-equivalent $ (0 = no limit)
    RW_DRAFT: "false"
    RW_BASE: ""                 # default: the project's default branch
    RW_ARGS: ""                 # more rw run flags
    RW_TRUST_REPO_CONFIG: "true"
    CLAUDE_CODE_VERSION: latest
    CODEX_VERSION: latest
    GIT_DEPTH: "50"
  script:
    - |
      set -euo pipefail
      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "set GITLAB_TOKEN: a project access token (Developer, api + write_repository) as a masked CI/CD variable"
        exit 1
      fi
      out="$CI_PROJECT_DIR/relayweft-report"
      mkdir -p "$out"
      # Keeps the report folder out of git status: a batch starts only on a
      # clean working tree.
      echo "/relayweft-report/" >> .git/info/exclude

      echo "--- rw"
      case "$(uname -m)" in
        x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;;
        *) echo "no rw build for $(uname -m)"; exit 1 ;;
      esac
      asset="rw-linux-$arch"
      if [ "$RW_VERSION" = latest ]; then
        base="https://github.com/Sparkz400/relayweft/releases/latest/download"
      else
        base="https://github.com/Sparkz400/relayweft/releases/download/$RW_VERSION"
      fi
      bin="$(mktemp -d)"
      curl -fsSL --retry 3 -o "$bin/$asset" "$base/$asset"
      curl -fsSL --retry 3 -o "$bin/checksums.txt" "$base/checksums.txt"
      (cd "$bin" && grep " \*\?$asset\$" checksums.txt | sha256sum -c -)
      mv "$bin/$asset" "$bin/rw" && chmod +x "$bin/rw"
      export PATH="$bin:$PATH"
      rw version

      echo "--- agent CLIs"
      claude=false; codex=false
      if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then claude=true; fi
      if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then codex=true; fi
      if [ "$claude" = false ] && [ "$codex" = false ]; then
        echo "no agent credentials: set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (Claude Code), and/or OPENAI_API_KEY or CODEX_AUTH_JSON (Codex)"
        exit 1
      fi
      provider="$RW_PROVIDER"
      if [ -z "$provider" ] && [ "$claude" != "$codex" ]; then
        if [ "$claude" = true ]; then provider=claude; else provider=codex; fi
      fi
      pkgs=()
      if [ "$claude" = true ]; then pkgs+=("@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"); fi
      if [ "$codex" = true ]; then pkgs+=("@openai/codex@$CODEX_VERSION"); fi
      npm install -g --no-fund --no-audit "${pkgs[@]}"
      if [ "$codex" = true ]; then
        CODEX_HOME="$(mktemp -d)"
        export CODEX_HOME
        if [ -n "${CODEX_AUTH_JSON:-}" ]; then
          # A File variable holds a path; a plain one holds the JSON.
          if [ -f "$CODEX_AUTH_JSON" ]; then cp "$CODEX_AUTH_JSON" "$CODEX_HOME/auth.json"
          else (umask 077; printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"); fi
        else
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
        fi
        unset OPENAI_API_KEY CODEX_AUTH_JSON
      fi

      echo "--- git"
      # The runner's origin URL carries the job token: replace it, and let
      # git push with GITLAB_TOKEN through a credential helper. Agents and
      # the commands rw runs for them never get GITLAB_TOKEN, so a push of
      # theirs finds no credentials.
      git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
      git config --local "credential.$CI_SERVER_URL.helper" ""
      git config --local --add "credential.$CI_SERVER_URL.helper" '!f() { test "$1" = get && test -n "$GITLAB_TOKEN" || exit 0; echo username=oauth2; echo "password=$GITLAB_TOKEN"; }; f'
      git config user.name "${GITLAB_USER_NAME:-Relayweft}"
      git config user.email "${GITLAB_USER_EMAIL:-relayweft@noreply.$CI_SERVER_HOST}"
      if [ "$CI_SERVER_HOST" != gitlab.com ]; then export GITLAB_HOST="$CI_SERVER_HOST"; fi
      base_branch="${RW_BASE:-$CI_DEFAULT_BRANCH}"
      git fetch --depth="$GIT_DEPTH" origin "+refs/heads/$base_branch:refs/remotes/origin/$base_branch"
      git checkout -B "$base_branch" "refs/remotes/origin/$base_branch"
      if [ "$RW_TRUST_REPO_CONFIG" = true ] && [ -f .relayweft.yaml ]; then rw trust --yes; fi

      echo "--- rw run"
      rw history --json -n 1000 > "$out/.before.json" 2>/dev/null || echo '[]' > "$out/.before.json"
      args=(run)
      if [ -n "$RW_ISSUE" ]; then
        args+=(--issue "$RW_ISSUE" --pr)
      else
        args+=(--issues "label:$RW_ISSUES_LABEL" --limit "$RW_LIMIT" --pr)
      fi
      if [ "$RW_DRAFT" = true ]; then args+=(--draft); fi
      if [ -n "$RW_BASE" ]; then args+=(--base "$RW_BASE"); fi
      if [ -n "$provider" ]; then args+=(--provider "$provider"); fi
      if [ -n "$RW_BUDGET_TASK_USD" ]; then args+=(--budget-task-usd "$RW_BUDGET_TASK_USD"); fi
      if [ -n "$RW_ARGS" ]; then read -r -a extra <<< "$RW_ARGS"; args+=("${extra[@]}"); fi
      echo "rw ${args[*]}"
      set +e
      rw "${args[@]}" 2>&1 | tee "$out/rw-run.log"
      rc=${PIPESTATUS[0]}
      set -e

      echo "--- reports"
      rw history --json -n 1000 > "$out/.after.json" 2>/dev/null || echo '[]' > "$out/.after.json"
      ids=$(node -e '
        const fs = require("fs");
        const old = new Set(JSON.parse(fs.readFileSync(process.argv[1])).map(t => t.id));
        for (const t of JSON.parse(fs.readFileSync(process.argv[2])).reverse()) if (!old.has(t.id)) console.log(t.id);
      ' "$out/.before.json" "$out/.after.json" || true)
      for id in $ids; do
        rw report "$id" --out "$out/$id.html" >/dev/null || true
        rw report "$id" --md --out "$out/$id.md" >/dev/null || true
      done
      log=$(sed -n 's/^session log: //p' "$out/rw-run.log" | tail -n 1)
      if [ -n "$log" ] && [ -f "$log" ]; then cp "$log" "$out/"; fi
      rm -f "$out/.before.json" "$out/.after.json"
      grep -E '^opened (pull|merge) request [#!][0-9]+: ' "$out/rw-run.log" || true
      exit "$rc"
  after_script:
    - git config --local --unset-all "credential.$CI_SERVER_URL.helper" || true
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - relayweft-report/
