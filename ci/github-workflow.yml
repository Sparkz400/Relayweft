# Switchyard in GitHub Actions: copy this file to .github/workflows/switchyard.yml
# in your repository. Setup and the security model: docs/ci.md.
#
#   - Label an issue "sy": a job runs it and opens a pull request ("Closes #N").
#   - Every night at 02:30 UTC: the open issues labelled "sy" that no open
#     pull request closes yet, at most 5.
#   - Actions > Switchyard > Run workflow: one issue by number.
name: switchyard

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty runs every open issue labelled sy)
        required: false

# The job needs to push a branch, open a pull request and comment on the
# issue; nothing else.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  switchyard:
    # Only the "sy" label starts a run. Adding a label needs triage access,
    # so someone you trust decides which issue the agents read.
    if: github.event_name != 'issues' || github.event.label.name == 'sy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One run per issue at a time; the nightly batch waits for the others.
    concurrency:
      group: switchyard-${{ github.event.issue.number || inputs.issue || 'batch' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The agents must not find the token in .git/config; Switchyard
          # gives git its own credential helper for the push.
          persist-credentials: false

      # @main builds sy from source. Pin a release tag (it installs that
      # release's binary) or a commit SHA once one includes this action.
      - uses: Sparkz400/switchyard@main
        with:
          issue: ${{ github.event.issue.number || inputs.issue }}
          issues-label: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')) && 'sy' || '' }}
          # One of the two Claude Code sign-ins and/or one of the two Codex
          # ones. With both providers, Switchyard routes between them.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          budget-task-usd: "10"
          # A token that is not GITHUB_TOKEN lets the pull request start your
          # CI workflows (see docs/ci.md):
          # github-token: ${{ secrets.SWITCHYARD_TOKEN }}
