# nfpm config for the .deb, .rpm and .apk packages (release.yml builds
# them). Run it from the repo root with VERSION and ARCH (amd64 or arm64)
# set, the linux binary for ARCH copied to build/rw (nfpm does not
# expand variables in file paths) and the completion scripts in
# build/completions (linux-packages.sh does all of this):
#
#   cp dist/rw-linux-amd64 build/rw
#   VERSION=1.2.3 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb \
#     -t dist/relayweft-linux-amd64.deb
name: relayweft
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: devel
priority: optional
maintainer: Sparkz400 <62327601+Sparkz400@users.noreply.github.com>
vendor: Sparkz400
homepage: https://github.com/sparkz400/relayweft
license: MIT
description: |-
  Terminal app that routes coding work between the Codex CLI and Claude Code.
  Relayweft (rw) drives the official codex and claude CLIs with their
  normal login and never uses API keys.
depends:
  - git
contents:
  - src: build/rw
    dst: /usr/bin/rw
    file_info:
      mode: 0755
  # Shell completion, printed by linux-packages.sh with `rw completion`.
  # zsh: Debian's fpath has vendor-completions, the others site-functions.
  - src: build/completions/rw.bash
    dst: /usr/share/bash-completion/completions/rw
    file_info:
      mode: 0644
  - src: build/completions/rw.zsh
    dst: /usr/share/zsh/vendor-completions/_rw
    packager: deb
    file_info:
      mode: 0644
  - src: build/completions/rw.zsh
    dst: /usr/share/zsh/site-functions/_rw
    packager: rpm
    file_info:
      mode: 0644
  - src: build/completions/rw.zsh
    dst: /usr/share/zsh/site-functions/_rw
    packager: apk
    file_info:
      mode: 0644
  - src: build/completions/rw.fish
    dst: /usr/share/fish/vendor_completions.d/rw.fish
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/relayweft/README.md
    file_info:
      mode: 0644
  # Debian keeps the license as the package's copyright file.
  - src: LICENSE
    dst: /usr/share/doc/relayweft/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/relayweft/LICENSE
    packager: rpm
    type: license
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/relayweft/LICENSE
    packager: apk
    file_info:
      mode: 0644
