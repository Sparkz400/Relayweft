# golangci-lint v2 configuration. CI runs the version pinned in
# .github/workflows/lint.yml; locally: golangci-lint run ./...
#
# The set is golangci-lint's "standard" one, spelled out so a new
# golangci-lint release cannot add linters behind our back. Left out on
# purpose:
#   - gosec: on this code base (a tool whose job is to run git, agent CLIs
#     and user-configured commands, and to write files where the user
#     points it) it mostly reports exec.Command with variable arguments,
#     file permissions and paths from config. CodeQL (codeql.yml) already
#     covers injection with data flow, which gosec lacks.
#   - style linters (revive, gocritic, ...): noise for a mature code base.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # includes the former gosimple and stylecheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Every rw command's FlagSet but rw update's uses ExitOnError:
        # Parse exits on a bad flag and never returns an error. rw update
        # (ContinueOnError) checks it.
        - (*flag.FlagSet).Parse
        # Killing a child that may have exited already; a Wait or a
        # liveness check follows wherever it matters.
        - (*os.Process).Kill
        - golang.org/x/sys/windows.CloseHandle
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: doc-comment and naming conventions.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "Could apply De Morgan's law": !(a && b) often reads closer to
        # the comment above it than !a || !b.
        - -QF1001
  exclusions:
    generated: lax
    presets:
      # Unchecked Close, Flush, os.Remove(All), fmt.Print*, os.Setenv, ...:
      # cleanup and console output where an error has nowhere to go.
      - std-error-handling
    rules:
      # In tests a failed setup step shows up as the test failing.
      - path: _test\.go
        linters: [errcheck]

# gofmt runs as its own CI step (lint.yml), on Linux: a Windows checkout
# with core.autocrlf has CRLF files that gofmt would all report.
