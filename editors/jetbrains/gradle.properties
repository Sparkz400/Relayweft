pluginGroup = io.github.sparkz400.relayweft
pluginVersion = 0.1.0

# The platform the plugin is compiled against: the oldest one it supports
# (since-build 252 = 2025.2). verifyPlugin checks it against newer IDEs.
platformVersion = 2025.2.6.3

# The IDE bundles the Kotlin standard library: do not ship another one.
kotlin.stdlib.default.dependency = false

# Keep the machine usable while building: few workers, no parallel projects,
# modest heaps.
org.gradle.workers.max = 4
org.gradle.parallel = false
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xmx1500m
org.gradle.caching = true
org.gradle.configuration-cache = true
