name: ci

on:
  push:
  pull_request:

# Pull requests from forks run here too: the token only needs to read.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: go vet ./...
      - run: go test -race ./...
        if: matrix.os != 'windows-latest'
      - run: go test ./...
        if: matrix.os == 'windows-latest'
      - name: onboarding timing (guided setup to first task, scripted agents)
        run: go test -run '^TestOnboarding$' -v -count=1 ./cmd/sy

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/sy.exe ./cmd/sy
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/sy-arm64.exe ./cmd/sy
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/sy-linux ./cmd/sy
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/sy-macos ./cmd/sy
      - uses: actions/upload-artifact@v7
        with:
          name: sy-binaries
          path: dist/
