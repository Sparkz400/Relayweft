name: ci

on:
  push:
  pull_request:

# Pull requests from forks run here too: the token only needs to read.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Ubuntu runners have docker: the container sandbox test must run
      # there, not skip (TestSandboxSelftest). Elsewhere it skips without
      # docker for Linux containers.
      RW_TEST_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && 'require' || '' }}
      # The shells TestCompletionInRealShells must find (it skips missing
      # ones otherwise): macOS has bash 3.2, Windows PowerShell 5.1 too.
      RW_TEST_SHELLS: ${{ matrix.os == 'ubuntu-latest' && 'bash,zsh,fish,pwsh' || matrix.os == 'windows-latest' && 'bash,pwsh,powershell' || 'bash,zsh,pwsh' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: zsh and fish for the completion tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish >/dev/null
      - name: git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: go vet ./...
      - run: go test -race ./...
        if: matrix.os != 'windows-latest'
      # internal/orchestrator takes ~9.5 of the default 10 minutes on the
      # Windows runner (real git in every test).
      - run: go test -timeout 20m ./...
        if: matrix.os == 'windows-latest'
      - name: onboarding timing (guided setup to first task, scripted agents)
        run: go test -run '^TestOnboarding$' -v -count=1 ./cmd/rw

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/rw.exe ./cmd/rw
          GOOS=windows GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/rw-arm64.exe ./cmd/rw
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/rw-linux ./cmd/rw
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/rw-macos ./cmd/rw
      - uses: actions/upload-artifact@v7
        with:
          name: rw-binaries
          path: dist/
