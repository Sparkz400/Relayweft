name: release

# Builds sy for every supported platform, the Linux packages, and publishes
# a GitHub release. Asset names are a contract: `sy update`, the scoop,
# winget, Homebrew and AUR manifests and the CI install scripts all look
# them up by name. Add new assets, never rename existing ones, and list
# every asset in checksums.txt (packaging/README.md has the table).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (the tag v1.2.3 is created on the selected ref)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes with git (gh creates the release and tag),
          # so the write token stays out of .git/config, out of reach of
          # the tests and nfpm.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$raw' is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: test
        run: go test ./...

      - name: build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/sy-$os-$arch"
            if [ "$os" = "windows" ]; then out="$out.exe"; fi
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$out" ./cmd/sy
          done

      - name: linux packages
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # .deb, .rpm and .apk for amd64 and arm64, built with a pinned and
        # checksum-verified nfpm.
        run: sh packaging/linux-packages.sh "$VERSION" dist

      - name: checksums
        run: |
          cd dist
          sha256sum sy-* switchyard-* > checksums.txt
          cat checksums.txt

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        # A tag with a suffix (v1.2.0-rc1) becomes a pre-release, which the
        # releases/latest API (and so `sy update`) skips.
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --generate-notes --target "$GITHUB_SHA" --title "Switchyard $TAG" $pre
