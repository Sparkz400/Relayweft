name: packaging

# Installs rw the way users do: the Homebrew formula from this repo as a
# tap (macOS and Linux), the .deb, .rpm and .apk packages built from this
# branch in Ubuntu, Fedora and Alpine containers, and the AUR PKGBUILD in
# an Arch Linux container. It also checks that the committed manifests are
# what packaging/render-manifests.sh makes for their release.
on:
  pull_request:
    paths:
      - "packaging/**"
      - "Formula/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/packaging.yml"
      - "cmd/rw/update*.go"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: render for the formula's release and compare
        env:
          # For `gh release view` (the release date in the winget
          # manifests); reading is all it needs.
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/relayweft.rb | head -n 1)"
          echo "formula version: $version"
          [ -n "$version" ]
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" \
            "https://github.com/sparkz400/relayweft/releases/download/v$version/checksums.txt"
          sh packaging/render-manifests.sh "$version" "$RUNNER_TEMP/checksums.txt" "$RUNNER_TEMP/winget"
          grep ReleaseDate "$RUNNER_TEMP/winget/Sparkz400.Relayweft.installer.yaml"
          if ! git diff --exit-code; then
            echo "::error::the committed manifests differ from the rendered ones; run packaging/render-manifests.sh $version and commit"
            exit 1
          fi

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: brew install from this branch
        run: |
          if ! command -v brew >/dev/null; then
            # Linux runners have Homebrew, but not on PATH.
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          # The tap is a clone of this checkout, as `brew tap` makes of
          # https://github.com/Sparkz400/Relayweft.
          brew tap sparkz400/relayweft "$GITHUB_WORKSPACE"
          brew install sparkz400/relayweft/relayweft
          brew test sparkz400/relayweft/relayweft
          brew style sparkz400/relayweft/relayweft
          brew audit --strict --formula sparkz400/relayweft/relayweft
          rw="$(brew --prefix)/bin/rw"
          "$rw" version
          want="relayweft $(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' Formula/relayweft.rb | head -n 1)"
          [ "$("$rw" version)" = "$want" ]
          echo "rw=$rw" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: rw update leaves Homebrew's rw alone
        env:
          GH_TOKEN: ${{ github.token }}
        # This branch's rw, as an old version, in place of the formula's.
        run: |
          real="$(cd "$(dirname "$rw")" && cd "$(dirname "$(readlink "$rw")")" && pwd -P)/rw"
          echo "real binary: $real"
          rm -f "$real"
          go build -ldflags "-X main.version=0.0.1" -o "$real" ./cmd/rw
          "$rw" update --check | tee "$RUNNER_TEMP/check.txt"
          grep -q 'brew upgrade relayweft' "$RUNNER_TEMP/check.txt"
          if "$rw" update --yes; then
            echo "::error::rw update replaced Homebrew's binary"
            exit 1
          fi
          [ "$("$rw" version)" = "relayweft 0.0.1" ]
          brew uninstall relayweft
          [ ! -e "$rw" ]

  linux-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build rw and the packages
        env:
          CGO_ENABLED: "0"
        # An old version, so `rw update` sees a newer release and must
        # leave the package's binary alone.
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=0.0.1" -o dist/rw-linux-amd64 ./cmd/rw
          sh packaging/linux-packages.sh 0.0.1 dist amd64
          ls -l dist
      - name: install in containers
        env:
          # Read-only token against the GitHub API's rate limit for the
          # `rw update` checks.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for t in "ubuntu:24.04 deb" "debian:stable deb" "fedora:latest rpm" "alpine:latest apk"; do
            set -- $t
            echo "::group::$1"
            docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" -w /src "$1" \
              sh packaging/test-install.sh "$2" "dist/relayweft-linux-amd64.$2" 0.0.1
            echo "::endgroup::"
          done

  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: makepkg and pacman in Arch Linux
        run: docker run --rm -v "$PWD:/src:ro" -w /src archlinux:latest sh packaging/test-install.sh aur
