name: jetbrains

# The JetBrains plugin in editors/jetbrains: unit tests, the tests against
# a real sy (built here) with a scripted agent, the plugin in a headless
# IDE, the IntelliJ Plugin Verifier against several IDE versions, and the
# plugin zip as an artifact. Nothing is published.
on:
  push:
    paths:
      - 'editors/jetbrains/**'
      - '.github/workflows/jetbrains.yml'
  pull_request:
    paths:
      - 'editors/jetbrains/**'
      - '.github/workflows/jetbrains.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editors/jetbrains
    env:
      # The tests against a real sy must run here, not be skipped.
      SY_IT_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v6
      - name: tests (unit, real sy, headless IDE)
        run: ./gradlew --no-daemon test
      - name: build the plugin zip
        run: ./gradlew --no-daemon buildPlugin
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jetbrains-test-reports-${{ matrix.os }}
          path: editors/jetbrains/build/reports/tests/
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: switchyard-jetbrains-plugin
          path: editors/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: free disk space for the IDE downloads
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: plugin verifier (IDEA 2025.2, 2025.3, 2026.2)
        run: ./gradlew --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jetbrains-verifier-reports
          path: editors/jetbrains/build/reports/pluginVerifier/
          if-no-files-found: ignore
