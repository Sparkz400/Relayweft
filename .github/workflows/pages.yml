name: pages

# The docs site at https://sparkz400.github.io/Relayweft/.
#
# website/build.sh generates the pages from website/pages and the repo's
# own Markdown (README, docs/, ROADMAP, ...), checks every link, and builds
# them with Hugo into _site. Pull requests only build and check; pushes to
# main, a manual run and a call from another workflow also deploy.
#
# Calling it from another workflow (for example after a release, to
# redeploy the package repository):
#
#   jobs:
#     pages:
#       uses: ./.github/workflows/pages.yml
#       permissions: {contents: read, pages: write, id-token: write}
#       secrets: inherit
#
# Pages must be set to "GitHub Actions" (Settings > Pages > Source).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - website/**
      - README.md
      - ROADMAP.md
      - SECURITY.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - plan.md
      - relayweft.yaml
      - editors/*/README.md
      - packaging/README.md
      - packaging/repo/**
      - cmd/rw/** # the CLI reference comes from rw --help
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - website/**
      - README.md
      - ROADMAP.md
      - SECURITY.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - plan.md
      - relayweft.yaml
      - editors/*/README.md
      - packaging/README.md
      - packaging/repo/**
      - cmd/rw/** # the CLI reference comes from rw --help
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.167.0
  HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tgz" | sha256sum -c -
          mkdir -p /tmp/hugo && tar -xzf /tmp/hugo.tgz -C /tmp/hugo
          sudo install /tmp/hugo/hugo /usr/local/bin/hugo
          hugo version
      - name: test the page generator
        working-directory: website
        run: |
          go vet ./...
          go test ./...
      - name: the site's address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: build (and check every link)
        env:
          GEN_FLAGS: -require-cli
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || 'https://sparkz400.github.io/Relayweft/' }}
          HUGO_ENVIRONMENT: production
        run: website/build.sh
      # The signed apt and dnf repositories live on the same site. Their
      # script adds _site/apt/ and _site/rpm/; give it the env it needs here.
      - name: package repositories
        if: github.event_name != 'pull_request' && hashFiles('packaging/repo/build-pages.sh') != ''
        run: bash packaging/repo/build-pages.sh _site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
