# Switchyard configuration.
#
# Every model for every job lives here. You can also change them at runtime:
#   - in the TUI press `m` (model picker) and `s` inside it to save,
#   - or type `/route worker claude:sonnet:high` at the prompt,
#   - or pass `--route worker=claude:sonnet:high` on the command line.
#
# `sy models --refresh` re-reads the Codex model catalog from `codex debug models`.

# Each role has a route on BOTH providers. `prefer` picks which one is used:
#   codex | claude  - always that provider (unless it is at its usage limit)
#   other           - the opposite provider of the planner (used for review)
#   auto            - whichever provider has used fewer tokens this session
# If the preferred provider is at its usage limit, the role's route on the other
# provider is used automatically. Leave `effort` empty to use the CLI default.
roles:
  planner:
    prefer: codex
    codex: {model: gpt-6.1-sol, effort: high}
    claude: {model: opus, effort: high}
  worker:
    prefer: codex
    codex: {model: gpt-6.1-sol, effort: medium}
    claude: {model: sonnet, effort: medium}
  worker_high:
    prefer: codex
    codex: {model: gpt-6.1-sol, effort: xhigh}
    claude: {model: opus, effort: high}
  explorer:
    prefer: claude
    codex: {model: gpt-6-luna, effort: low}
    claude: {model: haiku, effort: ""}
  researcher:
    prefer: claude
    codex: {model: gpt-6-luna, effort: low}
    claude: {model: haiku, effort: ""}
  reviewer:
    prefer: other
    codex: {model: gpt-6.1-sol, effort: xhigh}
    claude: {model: opus, effort: high}
  judge:
    prefer: claude
    codex: {model: gpt-6-luna, effort: low}
    claude: {model: haiku, effort: low}

providers:
  codex:
    disabled: false                # true = never route to Codex
    command: codex                 # resolved with PATH/PATHEXT, so codex.cmd works on Windows
    tested_version: "codex-cli 0.160.0"
    write_sandbox: workspace-write # sandbox for writing agents (read-only agents always use read-only)
    extra_args: []                 # appended to every `codex exec` call
    limit_cooldown: 1h             # how long a provider stays "at limit" if no reset time is known
    efforts: [low, medium, high, xhigh, max, ultra]
    models:                        # the catalog shown in the model picker (you can also type any id)
      - {id: gpt-6.1-sol, label: GPT-6.1-Sol, tier: strong}
      - {id: gpt-6-astra, label: GPT-6-Astra, tier: strong}
      - {id: gpt-6-sol, label: GPT-6-Sol, tier: strong}
      - {id: gpt-6-luna, label: GPT-6-Luna, tier: fast}
      - {id: gpt-5.6-sol, label: GPT-5.6-Sol, tier: standard}
      - {id: gpt-5.6-terra, label: GPT-5.6-Terra, tier: standard}
      - {id: gpt-5.6-luna, label: GPT-5.6-Luna, tier: fast}
      - {id: gpt-5.5, label: GPT-5.5, tier: standard}
  claude:
    disabled: false
    command: claude
    tested_version: "2.1.288 (Claude Code)"
    write_permission_mode: acceptEdits # acceptEdits | auto | bypassPermissions | dontAsk
    write_allowed_tools: []            # e.g. ["Bash(go test *)", "Bash(npm test *)"] so workers can run tests
    extra_args: []
    limit_cooldown: 1h
    efforts: [low, medium, high, xhigh, max]
    models:
      - {id: fable, label: Fable (latest), tier: strong}
      - {id: opus, label: Opus (latest), tier: strong}
      - {id: sonnet, label: Sonnet (latest), tier: standard}
      - {id: haiku, label: Haiku (latest), tier: fast}
      - {id: claude-fable-5-1, label: Fable 5.1, tier: strong}
      - {id: claude-opus-5-5, label: Opus 5.5, tier: strong}
      - {id: claude-sonnet-5-5, label: Sonnet 5.5, tier: standard}
      - {id: claude-haiku-4-5, label: Haiku 4.5, tier: fast}

routing:
  max_files_before_high: 5         # rule 5: more files than this -> worker_high
  sensitive_paths: [auth, login, password, secret, payment, billing, migration, migrations, crypto, security]
  judge: false                     # rule-less cases ask the judge model (costs a little quota)
  judge_below_confidence: 0.65
  switch_at_utilization: 0.9       # move work to the other provider once one reports this share of its limit used (0 = off)
  learn: suggest                   # learned routes per repo: auto (refresh daily at task start) | suggest (only `sy tune --apply`) | off
  learn_min_samples: 8             # runs (recent ones count more) a route needs before it is learned

orchestrator:
  max_threads: 3                   # parallel agents at once
  parallel: true
  worktrees: true                  # parallel writing agents get their own git worktree (pooled, reused between tasks; `sy clean` removes them)
  worktree_max_files: 0            # >0: repos with more tracked files skip worktrees (writers take turns in your tree)
  review_before_plan: true
  review_single_step_plan: false   # also review one-step plans (sy bench: 10/10 approved, +1 strong-model call each)
  review_on_repeat_error: true
  review_before_done: true
  max_plan_revisions: 1
  max_fix_rounds: 1
  max_attempts: 3                  # per subtask, not counting limit fallbacks
  agent_timeout: 30m
  small_task_words: 12             # tasks shorter than this skip planning and run as one worker step
  approve_plan: true               # TUI / sy run --approve: show the plan and let you edit it before anything runs
  review_changes: false            # show each agent's changes (per file) before they land in your tree
  handoff: true                    # give agents a repo map, earlier tasks' notes and read-only findings

  # Machine protection: sy should never be what tips your PC over.
  low_priority: true               # agents and git run below normal CPU priority
  max_cpu_percent: 90              # while the machine is busier than this, no new agent starts (0 = off)
  min_free_memory_mb: 1024         # ... or has less free RAM than this (0 = off)
  busy_max_wait: 2m                # start anyway after waiting this long
  min_free_disk_gb: 10             # never create a pool worktree below this much free disk (falls back to your tree)
  snapshot_max_file_mb: 100        # untracked files bigger than this are left out of snapshots and worktrees (0 = no limit)
  pool_warn_gb: 20                 # warn when this repo's worktree pool grows beyond this
  pool_max_idle: 336h              # pool worktrees unused this long are removed (14 days; 0 = keep)

# Your repo's own checks. Agents may run them without asking; Switchyard runs
# them after the agents finish and before the final review, and failures go
# into the fix round. `sy init` detects them (go test, npm test, pytest, ...).
verify:
  commands: []                     # e.g. ["go test ./...", "go vet ./..."]
  timeout: 10m

# Your own commands around every task (run through the system shell in the
# project folder). Environment: SY_TASK, SY_TASK_ID, SY_DIR, SY_STATUS
# (after_task: done|failed|cancelled), SY_SUMMARY, SY_STEP and SY_FILES
# (after_merge: the step and the files it changed, one per line).
# A failing before_task hook stops the task.
hooks:
  before_task: []                  # e.g. ["git fetch --quiet"]
  after_merge: []                  # e.g. ["gofmt -w ."]
  after_task: []                   # e.g. ["npm run lint"]
  timeout: 5m

# MCP servers for the agents, passed to both CLIs on every run of the listed
# roles. ${VAR} in any value is read from your environment when the agent
# starts, so secrets stay out of this file. In a repo's .switchyard.yaml
# this section applies only after `sy trust`. `sy doctor` checks it.
# mcp:
#   servers:
#     docs: {command: npx, args: ["-y", "@some/mcp-server"], env: {API_KEY: "${DOCS_API_KEY}"}}
#     db:   {url: "http://localhost:8080/mcp"}   # type: sse for SSE (Claude only)
#   roles: [worker, worker_high, explorer, researcher]   # the default
#   allow_tools: true    # pre-approve their tools for Claude (mcp__<server>)
#   strict: false        # true: Claude uses only these, not your own MCP config

# Desktop notifications (Windows toast, macOS, notify-send): a task finished
# or failed, a provider hit its limit, or sy waits for your approval.
notify:
  enabled: true                    # desktop notifications (Windows toast, macOS, notify-send)
  min_task: 1m                     # skip "done" for tasks shorter than this
  # Webhooks reach your phone: overnight runs, scheduled tasks and sy watch
  # post here (sy notify --test sends a test message). kind is slack,
  # discord, ntfy or json; it is read from the URL for hooks.slack.com,
  # discord.com/api/webhooks and ntfy.sh. url and token may use ${VAR}, so
  # the secret can stay in your environment. events (default: all): done,
  # failed, limit (a provider's usage limit), waiting (sy needs you), watch.
  # Task summaries leave your machine: on ntfy.sh, anyone who knows the
  # topic can read them, so pick a long random one (or a token).
  # webhooks:
  #   - url: https://ntfy.sh/sy-change-me-to-something-random
  #     events: [done, failed, watch]
  #   - url: ${SY_SLACK_WEBHOOK}
  #     kind: slack

# Spending caps (0 = off). tokens = fresh tokens on both providers; usd =
# Claude's API-equivalent price (not billed on a subscription). Day totals
# count today's finished tasks (local time, from the session logs) plus the
# running one. At a limit, a task you watch asks whether to go on; queued,
# scheduled and `sy run` tasks without --approve stop instead.
# Flags: --budget-task-tokens, --budget-task-usd, --budget-day-usd.
budget:
  task_tokens: 0
  task_usd: 0
  day_tokens: 0
  day_usd: 0
  warn_at: 0.8                     # warn once when a limit is this full
  # A day budget shared by several machines: each writes its own usage
  # (<machine id>.json, the `sy stats --json` format, no task texts) to this
  # folder after every task, and checks every machine's total for today
  # before an agent starts. A OneDrive or network folder; ~ and %VAR% work.
  team:
    dir: ""                        # "" = off
    day_tokens: 0
    day_usd: 0

# What the planner and the final reviewer learn from the repo's own docs:
# CONTRIBUTING, the PR template, CODEOWNERS, CI workflow commands (as hints,
# never run), AGENTS.md / CLAUDE.md. Summarized without a model call and
# marked as untrusted repo data in the prompt.
context:
  repo_docs: true
  repo_docs_max_kb: 8              # total size of the summary

# sy watch: after sy pr opened a pull request, failed checks and review
# comments (changes requested) get a follow-up task on the PR's branch,
# pushed to it (never forced). At most this many per pull request.
watch:
  max_rounds: 3

# Text that means "usage limit reached" (case-insensitive regular expressions).
limit_patterns:
  - "usage limit"
  - "hit your (usage )?limit"
  - "rate.?limit"
  - "limit (reached|exceeded)"
  - "quota"
  - "too many requests"
  - "\\b429\\b"
  - "purchase more credits"
  - "out of (credits|extra usage)"

theme: auto       # auto | unicode | ascii (ascii is used automatically on legacy conhost)
log_dir: ""       # empty = <user config dir>/switchyard/sessions
